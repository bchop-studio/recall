[project]
name = "recall"
version = "0.2.0"
description = "Give your AI agents a living per-project memory that Hermes, Claude Code, and Codex all read at session start."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
